limit_req_zone $binary_remote_addr zone=sysdom_canon_mcp:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.sysdom.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.sysdom.ai;

    ssl_certificate /etc/letsencrypt/live/mcp.sysdom.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.sysdom.ai/privkey.pem;

    client_max_body_size 256k;

    location = /healthz {
        proxy_pass http://127.0.0.1:3215/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }

    location = /mcp {
        limit_req zone=sysdom_canon_mcp burst=10 nodelay;
        proxy_pass http://127.0.0.1:3215/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
