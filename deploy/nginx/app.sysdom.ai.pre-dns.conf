server {
    listen 80;
    listen [::]:80;
    server_name app.sysdom.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        add_header Retry-After "60" always;
        return 503;
    }
}
