name: SimOne Main Gate

on:
  push:
    branches:
      - simone-main
  workflow_dispatch:

concurrency:
  group: simone-main-gate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Reject duplicate copy artifacts
        run: pnpm run check:duplicate-copies

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment hygiene
        run: pnpm run test:simone-deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build
